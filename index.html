<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Offline Music</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 90vh;
    }
    h2 { margin-top: 10px; }
    .card {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    input {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #333;
      color: #fff;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    button {
      background: #1db954;
      border: none;
      color: white;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #555; }
    #status { font-size: 13px; color: #aaa; margin-top: 8px; }
    ul { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
    li {
      background: #1a1a1a;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .song-title { font-size: 14px; word-break: break-all; }
    .play-btn {
      background: #333;
      width: auto;
      padding: 6px 14px;
      font-size: 13px;
    }
    .player-dock {
      margin-top: auto;
      padding-top: 10px;
    }
    audio { width: 100%; }
  </style>
</head>
<body>

  <h2>Offline Musik</h2>

  <div class="card">
    <input type="url" id="serverUrl" placeholder="https://xyz.trycloudflare.com">
    <button id="syncBtn" onclick="syncMusic()">Musik vom Laptop laden</button>
    <div id="status">Bereit</div>
  </div>

  <ul id="songList"></ul>

  <div class="player-dock">
    <audio id="audioPlayer" controls></audio>
  </div>

  <script>
    // 1. Service Worker registrieren
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    // Server-URL im localStorage merken
    const serverInput = document.getElementById('serverUrl');
    serverInput.value = localStorage.getItem('last_server_url') || '';

    // 2. IndexedDB Setup
    const DB_NAME = 'MusicAppDB';
    const STORE_NAME = 'tracks';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          e.target.result.createObjectStore(STORE_NAME, { keyPath: 'name' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveTrack(name, blob) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({ name, blob });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getStoredTracks() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // 3. UI Aktualisieren
    async function renderList() {
      const list = document.getElementById('songList');
      list.innerHTML = '';
      const tracks = await getStoredTracks();

      if (tracks.length === 0) {
        list.innerHTML = '<li style="color:#666">Noch keine Songs offline gespeichert.</li>';
        return;
      }

      tracks.forEach(track => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span class="song-title">${track.name}</span>
          <button class="play-btn" onclick="playSong('${encodeURIComponent(track.name)}')">▶ Abspielen</button>
        `;
        list.appendChild(li);
      });
    }

    // 4. Song direkt aus IndexedDB abspielen
    async function playSong(encodedName) {
      const name = decodeURIComponent(encodedName);
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(name);

      req.onsuccess = () => {
        const record = req.result;
        if (record && record.blob) {
          const audio = document.getElementById('audioPlayer');
          audio.src = URL.createObjectURL(record.blob);
          audio.play();

          // MediaSession für Sperrbildschirm-Steuerung
          if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({ title: name });
          }
        }
      };
    }

    // 5. Synchronisations-Logik (Download über HTTPS)
    async function syncMusic() {
      let baseUrl = serverInput.value.trim().replace(/\/+$/, '');
      if (!baseUrl) {
        alert('Bitte Server-URL eintragen!');
        return;
      }
      localStorage.setItem('last_server_url', baseUrl);

      const status = document.getElementById('status');
      const syncBtn = document.getElementById('syncBtn');
      syncBtn.disabled = true;

      try {
        status.textContent = 'Suche Songs auf dem Laptop...';
        const res = await fetch(`${baseUrl}/api/songs`);
        const files = await res.json();

        if (!Array.isArray(files) || files.length === 0) {
          status.textContent = 'Keine Musikdateien im Laptop-Ordner gefunden.';
          syncBtn.disabled = false;
          return;
        }

        const stored = await getStoredTracks();
        const existingNames = new Set(stored.map(t => t.name));

        for (let i = 0; i < files.length; i++) {
          const filename = files[i];
          if (existingNames.has(filename)) continue;

          status.textContent = `Lade (${i + 1}/${files.length}): ${filename}`;
          const songRes = await fetch(`${baseUrl}/stream/${encodeURIComponent(filename)}`);
          const blob = await songRes.blob();

          await saveTrack(filename, blob);
        }

        status.textContent = 'Synchronisation abgeschlossen! Alle Tracks offline verfügbar.';
        renderList();
      } catch (err) {
        status.textContent = 'Fehler: ' + err.message;
      } finally {
        syncBtn.disabled = false;
      }
    }

    // Beim Starten gespeicherte Tracks anzeigen
    renderList();
  </script>
</body>
</html>
